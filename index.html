<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="description" content="Take a photo. Watch it bloom into watercolor.">
  <title>Paint Ithaca</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23bcaecb'/%3E%3Ccircle cx='21' cy='12' r='7' fill='%23d9bfb1' opacity='.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=clip-4">
  <script type="module" src="app.js?v=clip-4"></script>
</head>
<body>
  <header class="topbar"><a class="wordmark" href="./" aria-label="Paint Ithaca home">paint ithaca<span>.</span></a></header>
  <main class="camera-studio" data-state="loading" id="studio" aria-label="Watercolor camera">
    <div class="paper-camera" id="viewfinder">
      <video id="source-video" autoplay muted playsinline disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback" aria-hidden="true" tabindex="-1"></video>
      <canvas id="camera-preview" aria-label="Live camera preview" aria-hidden="true"></canvas>
      <canvas id="painting" aria-hidden="true" aria-label="Your photo blooming into watercolor"></canvas>
      <a class="photo-credits" href="assets/mosaic/credits.html" aria-label="Image sources"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg></a>
      <div class="camera-message" id="camera-message"><svg class="camera-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 1-2h6l1 2h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><circle cx="12" cy="12" r="4"/></svg><p id="message-text">Allow camera access.</p><button id="retry-camera" hidden>Open camera</button></div>
    </div>
    <div class="capture-controls">
      <div class="side-control"><button id="again" class="quiet-button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7"/></svg><span id="again-label">Retake</span></button><button id="flip-camera" class="quiet-button" aria-label="Switch camera" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg><span>Flip</span></button></div>
      <button id="shutter" aria-label="Take photo" disabled hidden><span class="button-ink" aria-hidden="true"><img class="button-bloom" src="assets/button-bloom.svg?v=clip-4" alt="" draggable="false" decoding="sync"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6 1.5-2h5L16 6h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="12.5" r="3.5"/></svg></button>
      <div class="side-control"><button id="submit" class="quiet-button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/></svg><span>Submit</span></button></div>
    </div>
    <p id="instruction" class="instruction" role="status"></p>
  </main>
</body>
</html>
