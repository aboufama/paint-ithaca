<!doctype html><html lang="en"><meta charset="utf-8"><title>Watercolor transport regression</title>
<body><h1>Watercolor transport regression</h1><button id="run">Run transport checks</button><pre id="result">Ready</pre>
<script type="module">
import { Watercolor } from '../watercolor.js';
const result = document.getElementById('result');
function assert(value, message) { if (!value) throw new Error(message); }
function fixture(wet) {
  const canvas = document.createElement('canvas');
  const engine = new Watercolor(canvas, { resolution: 128, automatic: false });
  const source = document.createElement('canvas'); source.width = source.height = 128;
  source.getContext('2d').fillRect(0,0,128,128); engine.setLiveSource(source);
  const gl = engine.gl, fluid = new Float32Array(128*128*4), pigment = new Float32Array(128*128*4);
  for (let y=0;y<128;y++) for(let x=0;x<128;x++) {
    const radius=Math.hypot(x-63.5,y-63.5), at=(y*128+x)*4;
    if (wet && radius<40) { fluid[at]=.25; fluid[at+3]=.8; }
    if (radius<12) pigment[at]=.3;
  }
  function load(texture, data) { gl.bindTexture(gl.TEXTURE_2D,texture); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,128,128,gl.RGBA,gl.FLOAT,data); }
  load(engine.fluid[0].textures[0],fluid); load(engine.paint[0].textures[0],pigment);
  function measure() {
    const fields=engine.readPaint(); let total=0, outside=0, radiusMoment=0, fixed=0;
    for(let y=0;y<128;y++) for(let x=0;x<128;x++) {
      let mass=0; const radiusSquared=(x-63.5)**2+(y-63.5)**2;
      for(let f=0;f<4;f++) for(let channel=0;channel<4;channel++) {
        const value=fields[f][(y*128+x)*4+channel];
        assert(Number.isFinite(value)&&value>=0,'Non-finite or negative pigment');
        mass+=value;if(f>=2)fixed+=value;
      }
      total+=mass; radiusMoment+=mass*radiusSquared; if(radiusSquared>14**2)outside+=mass;
    }
    return {total,outsideFraction:outside/total,variance:radiusMoment/total,fixedFraction:fixed/total};
  }
  const initial=measure(); for(let i=0;i<60;i++)engine.step(); const final=measure();
  assert(gl.getError()===gl.NO_ERROR,'WebGL error');engine.dispose();
  return {initial,final,massRatio:final.total/initial.total,varianceRatio:final.variance/initial.variance};
}
function run() {
  try {
    const wet=fixture(true),dry=fixture(false);
    assert(wet.massRatio>.8&&wet.massRatio<1.2,'Wet pigment mass drift exceeds tolerance');
    assert(wet.final.outsideFraction>.02,'Wet pigment did not bleed beyond its footprint');
    assert(wet.varianceRatio>1.1,'Wet pigment failed to spread');
    assert(dry.final.outsideFraction<.001,'Dry pigment moved like a blur filter');
    const report={passed:true,wet,dry};result.textContent=JSON.stringify(report,null,2);return report;
  } catch(error) {result.textContent=error.stack;throw error;}
}
document.getElementById('run').onclick=run;
if(document.modelContext?.registerTool)document.modelContext.registerTool({name:'run_watercolor_transport_checks',description:'Run deterministic local GPU regression checks of wet pigment transport against a dry control. No camera or network access.',inputSchema:{type:'object',properties:{},additionalProperties:false},execute:run});
</script></body></html>
