  submissionStartPixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
  submit.click();submit.click();
  assert(studio.dataset.state==='submitting','Submit should start the collection animation immediately');
  assert(submit.disabled&&submit.hidden,'Submit must prevent a second submission');
  assert(document.getElementById('again').hidden,'Retake should wait for the short submit animation');
  assert(document.getElementById('shutter').hidden,'No camera control should appear during submission');
  assert(studio.getAttribute('aria-busy')==='true','Submission must expose its busy state');
  await waitForState('submitted');
  const submittedEntrance=await assertControlEntrance([document.getElementById('instruction'),document.getElementById('again')],'Submitted message and next capture',200);
  assert(scenePreparations===1&&sceneFinals===1,'Double Submit should render one complete collection animation');
  assert(exactSubmissionStart||matchMedia('(prefers-reduced-motion: reduce)').matches,'Submission must begin at the unchanged painting');
  assert(mosaicImages>=4&&mosaicTiles>=40,'Collection should contain many real, locally bundled images');
  assert(snapshotCount===2&&requests===2,'Submit must reuse the captured painting without reopening or recapturing the camera');
  assert(cameraStream.getTracks().every(track=>track.readyState==='ended'),'Camera must remain stopped throughout Submit');
  assertFrozenSource();
  assert(networkRequests.every(request=>request.method.toUpperCase()==='GET'&&!request.hasBody),'Frontend submission preview must not upload camera data');
  assert(document.getElementById('instruction').textContent==='Thanks for contributing to the Paint Ithaca project :)','Completion should show the requested thank-you message');
  assert(document.getElementById('again-label').textContent==='Capture another','Completion should offer another capture');
  assert(!document.getElementById('again').hidden&&submit.hidden,'Completed view should expose only the next-capture action');
  assert(!studio.hasAttribute('aria-busy'),'Completed view must clear its busy state');
  return {passed:true,cameraRequests:requests,snapshotCount,scenePreparations,sceneFinals,exactSubmissionStart,mosaicImages,mosaicTiles,submittedEntrance,localPreviewOnly:true,frozenSourceUnchanged:true,outcome:'The painting joined the collection once; no camera photo was uploaded.'};
}
async function checkAfterSubmit() {
  const studio=document.getElementById('studio');
  assert(studio.dataset.state==='submitted','Run Submit checks before Capture another');
  const priorPreviewFrames=previewFrames,viewfinder=document.getElementById('viewfinder');
  const priorBounds=viewfinder.getBoundingClientRect(),observedStates=[];
  const rememberState=value=>{if(value&&observedStates.at(-1)!==value)observedStates.push(value);};
  const observer=new MutationObserver(records=>{
    records.forEach(record=>rememberState(record.oldValue));
    rememberState(studio.dataset.state);
  });
  observer.observe(studio,{attributes:true,attributeFilter:['data-state'],attributeOldValue:true});
  try {
    document.getElementById('again').click();
    assert(studio.dataset.state==='reopening','Capture another should retain the mosaic while reopening the camera');
    const painting=document.getElementById('painting'),paintingStyle=getComputedStyle(painting);
    assert(painting.getAttribute('aria-hidden')==='false','Completed collection must remain available while camera reopens');
    assert(paintingStyle.display!=='none'&&paintingStyle.visibility!=='hidden'&&Number(paintingStyle.opacity)>0,'Completed collection must remain visible while camera reopens');
    assert(document.getElementById('camera-message').hidden,'Camera reopening must not cover the collection with a loading message');
    assert(document.getElementById('shutter').disabled,'Shutter must wait for the returning live preview');
    assert(document.getElementById('instruction').textContent==='','New camera must clear completion text');
    assert(document.getElementById('submit').hidden,'New camera must hide the old Submit action');
    await waitForState('ready');
    rememberState(studio.dataset.state);
  } finally {observer.disconnect();}
  assert(observedStates.includes('returning')||matchMedia('(prefers-reduced-motion: reduce)').matches,'Camera should crossfade through the returning state before becoming ready');
  assert(document.getElementById('painting').getAttribute('aria-hidden')==='true','Ready camera should hide the completed collection from accessibility');
  const readyBounds=viewfinder.getBoundingClientRect(),boundsDelta={};
  for(const key of ['x','y','width','height']) {
    boundsDelta[key]=Math.abs(readyBounds[key]-priorBounds[key]);
    assert(boundsDelta[key]<=1,`Viewfinder ${key} moved by ${boundsDelta[key]}px when returning to the camera`);
  }
  assert(requests===3,'Capture another should open exactly one new camera stream');
  assert(snapshotCount===2,'Capture another should wait for the next shutter click');
  assert(previewFrames>priorPreviewFrames,'New camera should replace the collection with a fresh live preview');
  assert(cameraStream.getTracks().every(track=>track.readyState==='live'),'New camera stream must be live');
  assert(!document.getElementById('shutter').hidden&&!document.getElementById('shutter').disabled,'New capture must enable the shutter');
  assertCanvasPreview();
  return {passed:true,cameraRequests:requests,snapshotCount,previewFrames,observedStates,boundsDelta,collectionRetainedWhileReopening:true,clearedSubmission:true,cameraReady:true};
}
async function checkFlipTransition() {
  // Run this independent check after the full flow; its extra camera request
  // intentionally does not change the fixed counts expected by the earlier checks.
  await waitForFlipReady();
  const studio=document.getElementById('studio'),shutter=document.getElementById('shutter'),flip=document.getElementById('flip-camera');
  const priorRequests=requests,priorSnapshots=snapshotCount,oldStream=cameraStream,priorFacing=requestOptions.video.facingMode.ideal;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,exitSamples=[];
  let releaseCamera;
  cameraRequestGate=new Promise(resolve=>{releaseCamera=resolve;});
  try {
    flip.click();
    assert(studio.dataset.state==='loading','Switching cameras must enter loading');
    assert(shutter.disabled&&flip.disabled,'Loading must disable both outgoing camera controls');
    assert(oldStream.getTracks().every(track=>track.readyState==='ended'),'Switching cameras must stop the old camera stream');
    if(!reduced) {
      assert(!shutter.hidden&&!flip.hidden,'Outgoing controls must remain mounted during their loading fade');
      [shutter,flip].forEach(button=>{
        const animation=opacityAnimation(button);
        assert(animation&&Number(animation.effect.getTiming().duration)===140,'Loading should fade each camera control out over 140ms');
      });
    }
    const started=performance.now(),deadline=started+2000;
    while(!shutter.hidden||!flip.hidden) {
      assert(performance.now()<deadline,'Camera controls did not finish hiding while loading');
      const sample={timeMs:performance.now()-started,camera:effectiveOpacity(shutter),flip:effectiveOpacity(flip)};
      const prior=exitSamples.at(-1);
      assert(Math.abs(sample.camera-sample.flip)<.08,'Camera and Flip must fade together when loading');
      if(prior)assert(sample.camera<=prior.camera+.025&&sample.flip<=prior.flip+.025,'Loading fade must not brighten or snap back');
      exitSamples.push(sample);
      await new Promise(requestAnimationFrame);
    }
    assert(studio.dataset.state==='loading'&&shutter.hidden&&flip.hidden,'Loading must not leave a disabled camera placeholder visible');
    if(!reduced) {
      assert(exitSamples[0].camera>.9&&exitSamples[0].flip>.9,'Loading fade must begin visibly, without a hidden ancestor snapping it away');
      assert(exitSamples.filter(sample=>sample.camera>.08&&sample.camera<.92).length>=2,'Loading fade must contain multiple intermediate opacity samples');
    }
    cameraRequestGate=null;releaseCamera();
    await waitForState('ready');
    const entrance=await assertControlEntrance([shutter,flip],'Returning camera controls',90);
    assert(requests===priorRequests+1&&snapshotCount===priorSnapshots,'Flip must request one camera without taking a photograph');
    assert(requestOptions.video.facingMode.ideal!==priorFacing,'Flip must request the opposite facing camera');
    assert(!shutter.hidden&&!flip.hidden&&!shutter.disabled&&!flip.disabled,'Ready must restore both usable camera controls');
    assert(cameraStream.getTracks().every(track=>track.readyState==='live'),'Switched camera stream must be live');
    assertCanvasPreview();
    return {passed:true,cameraRequests:requests,snapshotCount,loadingHasNoPlaceholder:true,exitSamples,entrance,cameraReady:true};
  } finally {cameraRequestGate=null;releaseCamera?.();}
}
