<script type="module">

const networkRequests = [];
const originalFetch = window.fetch.bind(window);

const originalPrepare = SubmissionScene.prototype.prepare;

const originalSceneDraw = SubmissionScene.prototype.draw;

  async enumerateDevices() { return [{kind:'videoinput',deviceId:'fixture-camera-back'},{kind:'videoinput',deviceId:'fixture-camera-front'}]; }

const originalDraw = CanvasRenderingContext2D.prototype.drawImage;

const html = new DOMParser().parseFromString(await (await fetch('../index.html')).text(),'text/html');
document.body.append(...Array.from(html.body.children));
await import('../app.js?v=capture-2');
function waitForState(name) { return new Promise((resolve,reject)=>{
  const element=document.getElementById('studio');if(element.dataset.state===name){resolve();return;}
  const timeout=setTimeout(()=>{observer.disconnect();reject(new Error(`Timed out waiting for ${name}; current state: ${element.dataset.state}`));},12000);
  const observer=new MutationObserver(()=>{if(element.dataset.state===name){clearTimeout(timeout);observer.disconnect();resolve();}});observer.observe(element,{attributes:true,attributeFilter:['data-state']});
}); }
function assert(condition,text) { if(!condition)throw new Error(text); }
function assertPaintingShutter() {
  const shutter=document.getElementById('shutter'),style=getComputedStyle(shutter);
  assert(!shutter.hidden&&shutter.disabled,'Shutter must remain visible but disabled during painting');
  assert(style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)>0,'Painting must not visually hide the shutter');

async function waitForFlipReady() {

    await new Promise(requestAnimationFrame);
  }
  await Promise.all(document.querySelector('.capture-controls').getAnimations().map(animation=>animation.finished.catch(()=>{})));

function assertSnapshotOn(canvas,label) {

  const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
  assert(pixels.every((value,index)=>value===snapshotPixels.data[index]),`${label} must show the exact unmodified frozen photo`);
}
function captureBounds() {
  return Object.fromEntries(['viewfinder','shutter','flip-camera'].map(id=>[id,document.getElementById(id).getBoundingClientRect()]));
}
function assertCaptureControls(bounds,allowFade=false) {
  const shutter=document.getElementById('shutter'),flip=document.getElementById('flip-camera');
  assert(!shutter.hidden&&shutter.disabled&&!flip.hidden&&flip.disabled,'Camera and Flip must remain present and disabled until review');
  assert(getComputedStyle(document.querySelector('.capture-controls')).display==='grid','Capture must retain the same controls grid');
  if(!allowFade)assertPaintingShutter();
  assert(document.getElementById('again').hidden&&document.getElementById('submit').hidden,'Review actions must wait for the coordinated transition');
  for(const [id,before] of Object.entries(bounds)) {
    const after=document.getElementById(id).getBoundingClientRect();

async function verifyCrossfadeVisibilityPause(animation) {
  const hiddenDescriptor=Object.getOwnPropertyDescriptor(document,'hidden');
  try {
    Object.defineProperty(document,'hidden',{configurable:true,get:()=>true});
    document.dispatchEvent(new Event('visibilitychange'));
    assert(animation.playState==='paused','Hiding the page must pause the active photo crossfade');
    await animation.ready;
    const pausedTime=animation.currentTime;
    await new Promise(resolve=>setTimeout(resolve,80));
    assert(animation.playState==='paused'&&Math.abs(animation.currentTime-pausedTime)<1,'Crossfade must stay frozen while the page is hidden');
  } finally {
    if(hiddenDescriptor)Object.defineProperty(document,'hidden',hiddenDescriptor);else delete document.hidden;
    document.dispatchEvent(new Event('visibilitychange'));
  }
  assert(animation.playState==='running','Showing the page must resume the paused photo crossfade');

async function captureThroughReview(expectedSnapshots) {
  await waitForFlipReady();

  const bounds=captureBounds(),priorRequests=requests,priorPreparations=rendererPreparations.length;
  const states=[],paintingOpacities=[];

  const inspect=()=>{

      const value=studio.dataset.state;

      if(['preparing','painting','reviewing'].includes(value)) {
        assertCaptureControls(bounds,value==='reviewing');

      }

        if(!firstPaintingCheck){assertSnapshotOn(preview,'Frozen preview beneath watercolor');firstPaintingCheck=true;}

        }

    if(studio.dataset.state==='painting')paintingFrames++;

  };

    assert(clickReturnMs<200,`Shutter blocked the interface for ${clickReturnMs.toFixed(1)}ms`);
    assert(studio.dataset.state==='preparing','Capture must return immediately in the asynchronous preparing state');
    assert(snapshotCount===expectedSnapshots,'Double capture must copy one immutable camera frame');
    assertSnapshotOn(canvas,'Initial painting surface');assertSnapshotOn(preview,'Initial frozen preview');
    assert(Number(getComputedStyle(canvas).opacity)>0||Number(getComputedStyle(preview).opacity)>0,'The captured photograph must remain visible during preparation');
    assertCaptureControls(bounds);

    assert(['hidden','clip'].includes(getComputedStyle(shutter).overflow),'The button bloom must be clipped inside the camera button');
    const icon=shutter.querySelector('svg');
    assert(shutter.getAttribute('aria-label')==='Painting photo'&&icon&&getComputedStyle(icon).display!=='none'&&Number(getComputedStyle(icon).opacity)>0,'Camera button must keep its Painting photo label and visible camera icon');
    flip.click();assert(requests===priorRequests,'Disabled Flip must not reopen the camera during preparation');

    clearInterval(feedTimer);context.fillStyle='#ff00ff';context.fillRect(0,0,800,1000);

  assert(preparation.frames>0&&preparingFrames>0,'Renderer preparation must yield to browser animation frames');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function assertFrozenSource() {
  assert(snapshotCanvas.width===snapshotPixels.width&&snapshotCanvas.height===snapshotPixels.height,'Frozen source dimensions changed after capture');
  const currentSnapshot=snapshotCanvas.getContext('2d').getImageData(0,0,snapshotCanvas.width,snapshotCanvas.height).data;
  let changedSourceChannels=0;
  for(let i=0;i<currentSnapshot.length;i++)if(currentSnapshot[i]!==snapshotPixels.data[i])changedSourceChannels++;

  assert(previewStyle.display!=='none'&&previewStyle.visibility!=='hidden'&&Number(previewStyle.opacity)>0,'Live canvas preview is not visible');
  assert(preview.getBoundingClientRect().width>100,'Live preview is too small to frame a photo');

function assertTidalBloomFinish(canvas, pixels) {

  // can take a different raster path from filtering a fresh putImageData copy.
  const renderer=TidalBloom.create({width:canvas.width,height:canvas.height,photo:snapshotCanvas});
  try {
    renderer.draw(expectedContext,1);
    const expected=expectedContext.getImageData(0,0,reference.width,reference.height).data;

    for(let i=0;i<expected.length;i++){const error=Math.abs(pixels[i]-expected[i]);if(error)mismatchedChannels++;maxError=Math.max(maxError,error);totalError+=error;}
    const meanRenderError=totalError/expected.length;
    assert(mismatchedChannels===0,`Final camera image differs from Tidal Bloom in ${mismatchedChannels} channels: max=${maxError}, mean=${meanRenderError}`);
    return {selectedEffectMatch:true,exactTidalBloomMatch:true,frozenSourceUnchanged:true,meanRenderError,comparedPixels:canvas.width*canvas.height};

async function checkCapture() {
  await waitForState('ready');
  assert(requests===1,'Camera should request permission once on startup');
  assert(requestOptions.audio===false,'Camera must not request microphone');
  assertCanvasPreview();
  const shutter=document.getElementById('shutter');assert(!shutter.disabled,'Shutter not enabled after video ready');
  assert(snapshotCount===0,'Photo captured before clicking');

  assert(!document.getElementById('source-video').controls,'Native pause controls must not be offered');
  assert(cameraStream.getTracks().every(track=>track.readyState==='ended'),'Camera tracks must stop after snapshot');
  assert(shutter.hidden,'Shutter should hide when Retake and Submit become available');
  assert(snapshotCount===1,'Animation read the camera after the snapshot');
  assert(requests===1,'Animation restarted camera');
  const canvas=document.getElementById('painting'),paintingContext=canvas.getContext('2d');
  const pixels=paintingContext.getImageData(0,0,canvas.width,canvas.height).data;
  let error=0, count=0;
  for(let y=.1;y<.9;y+=.05)for(let x=.1;x<.9;x+=.05){
    const actual=(Math.floor(y*canvas.height)*canvas.width+Math.floor(x*canvas.width))*4;

}
async function checkRetake() {
  assert(document.getElementById('studio').dataset.state==='review','Run capture checks before Retake');
  document.getElementById('again').click();await waitForState('ready');
  assert(requests===2,'Retake must open a fresh camera stream');
  assertCanvasPreview();
  const transition=await captureThroughReview(2);
  const canvas=document.getElementById('painting'),paintingContext=canvas.getContext('2d');
  assert(document.getElementById('shutter').hidden,'Retake should hide the shutter once review actions appear');
  assert(snapshotCount===2,'Retake must capture exactly one new photo');
  assert(cameraStream.getTracks().every(track=>track.readyState==='ended'),'Retake camera was not stopped');

async function checkSubmit() {
  const studio=document.getElementById('studio'),submit=document.getElementById('submit');
  assert(studio.dataset.state==='review'&&snapshotCount===2,'Run capture and Retake checks before Submit');
  const canvas=document.getElementById('painting');
  submissionStartPixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
  submit.click();submit.click();
  assert(studio.dataset.state==='submitting','Submit should start the collection animation immediately');
  assert(submit.disabled&&submit.hidden,'Submit must prevent a second submission');
  assert(document.getElementById('again').hidden,'Retake should wait for the short submit animation');
  assert(document.getElementById('shutter').hidden,'No camera control should appear during submission');
  assert(studio.getAttribute('aria-busy')==='true','Submission must expose its busy state');
  await waitForState('submitted');
  assert(scenePreparations===1&&sceneFinals===1,'Double Submit should render one complete collection animation');
  assert(exactSubmissionStart||matchMedia('(prefers-reduced-motion: reduce)').matches,'Submission must begin at the unchanged painting');
  assert(mosaicImages>=4&&mosaicTiles>=40,'Collection should contain many real, locally bundled images');
  assert(snapshotCount===2&&requests===2,'Submit must reuse the captured painting without reopening or recapturing the camera');
  assert(cameraStream.getTracks().every(track=>track.readyState==='ended'),'Camera must remain stopped throughout Submit');
  assertFrozenSource();

async function checkAfterSubmit() {
  const studio=document.getElementById('studio');
  assert(studio.dataset.state==='submitted','Run Submit checks before Capture another');
  const priorPreviewFrames=previewFrames,viewfinder=document.getElementById('viewfinder');
  const priorBounds=viewfinder.getBoundingClientRect(),observedStates=[];
  const rememberState=value=>{if(value&&observedStates.at(-1)!==value)observedStates.push(value);};
  const observer=new MutationObserver(records=>{
    records.forEach(record=>rememberState(record.oldValue));
    rememberState(studio.dataset.state);
  });
  observer.observe(studio,{attributes:true,attributeFilter:['data-state'],attributeOldValue:true});
  try {
    document.getElementById('again').click();
    assert(studio.dataset.state==='reopening','Capture another should retain the mosaic while reopening the camera');
    const painting=document.getElementById('painting'),paintingStyle=getComputedStyle(painting);
    assert(painting.getAttribute('aria-hidden')==='false','Completed collection must remain available while camera reopens');
    assert(paintingStyle.display!=='none'&&paintingStyle.visibility!=='hidden'&&Number(paintingStyle.opacity)>0,'Completed collection must remain visible while camera reopens');
    assert(document.getElementById('camera-message').hidden,'Camera reopening must not cover the collection with a loading message');
    assert(document.getElementById('shutter').disabled,'Shutter must wait for the returning live preview');
    assert(document.getElementById('instruction').textContent==='','New camera must clear completion text');
    assert(document.getElementById('submit').hidden,'New camera must hide the old Submit action');
    await waitForState('ready');
    rememberState(studio.dataset.state);
  } finally {observer.disconnect();}
  assert(observedStates.includes('returning')||matchMedia('(prefers-reduced-motion: reduce)').matches,'Camera should crossfade through the returning state before becoming ready');
  assert(document.getElementById('painting').getAttribute('aria-hidden')==='true','Ready camera should hide the completed collection from accessibility');

  }

  assert(snapshotCount===2,'Capture another should wait for the next shutter click');
  assert(previewFrames>priorPreviewFrames,'New camera should replace the collection with a fresh live preview');
  assert(cameraStream.getTracks().every(track=>track.readyState==='live'),'New camera stream must be live');
  assert(!document.getElementById('shutter').hidden&&!document.getElementById('shutter').disabled,'New capture must enable the shutter');

}
