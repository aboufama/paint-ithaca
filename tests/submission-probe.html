<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submission animation verification</title><style>body{margin:32px;background:#f5f3ec;color:#53554e;font:14px system-ui}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;max-width:1200px;margin:auto}figure{margin:0}canvas{width:100%;border-radius:6px;display:block}figcaption{margin:12px 0}button{display:block;margin:24px auto;padding:12px 24px;border:0;background:#e0e3d9;border-radius:5px}#playback{width:280px;margin:auto}@media(max-width:600px){main{grid-template-columns:1fr 1fr}}</style></head><body><main></main><button id="replay">Replay submission preview</button><canvas id="playback" width="800" height="1000" aria-label="Submission animation"></canvas>
<script type="module">
import { SubmissionScene } from '../submission-scene.js?v=submit-2';
import TidalBloom from '../tidal-bloom.js?v=clip-4';
const photo=new Image();photo.src='./fixtures/cayuga-lake.jpg';await photo.decode();
const raw=document.createElement('canvas');raw.width=800;raw.height=1000;raw.getContext('2d').drawImage(photo,192,0,576,720,0,0,800,1000);
const painting=document.createElement('canvas');painting.width=800;painting.height=1000;const pc=painting.getContext('2d',{alpha:false});const watercolor=TidalBloom.create({width:800,height:1000,photo:raw});watercolor.draw(pc,1);watercolor.dispose();
const names=await(await fetch('../assets/mosaic/manifest.json')).json();const images=await Promise.all(names.map(async name=>{const image=new Image();image.src='../assets/mosaic/'+name;await image.decode();return image;}));
const output=document.getElementById('playback');const scene=new SubmissionScene(output);await scene.prepare(painting,{images});
for(const progress of [0,.35,.68,1]){scene.draw(progress);const fig=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=800;canvas.height=1000;canvas.getContext('2d').drawImage(output,0,0);caption.textContent=progress===1?'Joined':`${Math.round(progress*100)}%`;fig.append(canvas,caption);document.querySelector('main').append(fig);}
let raf;document.getElementById('replay').onclick=()=>{cancelAnimationFrame(raf);const start=performance.now();function draw(now){const p=Math.min(1,(now-start)/1800);scene.draw(p);if(p<1)raf=requestAnimationFrame(draw);}raf=requestAnimationFrame(draw);};
function check(){const ctx=output.getContext('2d');scene.draw(0);const actual=ctx.getImageData(0,0,800,1000).data,expected=pc.getImageData(0,0,800,1000).data;for(let i=0;i<actual.length;i++)if(actual[i]!==expected[i])throw Error('Submission changed the starting painting');const checksum=()=>{let hash=0;for(const value of ctx.getImageData(0,0,800,1000).data)hash=(Math.imul(hash,31)+value)>>>0;return hash;};scene.draw(.4);const first=checksum();scene.draw(.9);scene.draw(.4);if(first!==checksum())throw Error('Submission replay is not deterministic');scene.draw(1);return {passed:true,unchangedStartingPainting:true,deterministic:true,demoPhotos:images.length};}
if(document.modelContext?.registerTool)document.modelContext.registerTool({name:'run_submission_scene_checks',description:'Verify the local submit animation preserves its starting painting and replays deterministically. No camera or upload.',inputSchema:{type:'object',properties:{},additionalProperties:false},execute:check});
window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);scene.dispose();});
</script></body></html>
